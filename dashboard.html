<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SignalX — Live Navigation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a0800; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Topbar ── */
    #topbar {
      background: linear-gradient(135deg, rgba(180,40,0,0.95), rgba(255,80,0,0.7));
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,120,30,0.3);
      z-index: 1000; flex-shrink: 0;
    }
    #topbar h1 { font-size: 20px; color: #fff; letter-spacing: 2px; }
    #clock { font-size: 13px; color: #ffcc88; font-weight: 600; }
    #gps-status { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    #gps-status.searching { background: rgba(255,180,0,0.15); color: #ffcc00; border: 1px solid #ffcc00; }
    #gps-status.active    { background: rgba(0,200,100,0.15); color: #00e676; border: 1px solid #00e676; }
    #gps-status.error     { background: rgba(255,50,50,0.15); color: #ff5252; border: 1px solid #ff5252; }

    /* ── Search bar ── */
    #search-bar {
      background: rgba(25,6,0,0.97);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,100,30,0.2);
      display: flex; gap: 10px; align-items: center;
      flex-shrink: 0; position: relative; z-index: 500;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap input {
      width: 100%; padding: 9px 14px;
      background: rgba(255,100,30,0.08);
      border: 1px solid rgba(255,100,30,0.25);
      border-radius: 8px; color: #fff; font-size: 13px; outline: none;
    }
    .search-wrap input::placeholder { color: rgba(255,160,80,0.4); }
    .search-wrap input:focus { border-color: rgba(255,150,50,0.6); background: rgba(255,100,30,0.13); }

    .suggestions-box {
      position: absolute; top: calc(100% + 4px); left: 0;
      width: 100%; max-height: 220px; overflow-y: auto;
      background: rgba(28,7,0,0.98);
      border: 1px solid rgba(255,100,30,0.3);
      border-radius: 8px; z-index: 99999;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .suggestions-box::-webkit-scrollbar { width: 4px; }
    .suggestions-box::-webkit-scrollbar-thumb { background: rgba(255,100,30,0.3); border-radius: 4px; }
    .suggestion-item {
      padding: 9px 14px; font-size: 12px; color: #ffddaa;
      cursor: pointer; border-bottom: 1px solid rgba(255,100,30,0.08);
    }
    .suggestion-item:hover { background: rgba(255,100,30,0.18); color: #fff; }
    .suggestion-item .s-code { color: #ff9944; font-weight: 700; margin-right: 6px; }
    .suggestion-item .s-sub { font-size: 10px; color: rgba(255,160,80,0.4); margin-top: 2px; }

    #use-gps-btn {
      padding: 9px 14px; white-space: nowrap;
      background: linear-gradient(135deg, rgba(200,60,0,0.7), rgba(255,120,30,0.4));
      color: #ffddaa; border: 1px solid rgba(255,120,30,0.4);
      border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: background 0.2s;
    }
    #use-gps-btn:hover { background: linear-gradient(135deg, rgba(220,80,0,0.85), rgba(255,150,50,0.6)); }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 320px; min-width: 320px;
      background: rgba(18,4,0,0.9);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255,100,30,0.15);
      display: flex; flex-direction: column; overflow: hidden;
    }

    #next-junction {
      background: linear-gradient(135deg, rgba(160,35,0,0.55), rgba(90,18,0,0.55));
      border-bottom: 1px solid rgba(255,100,30,0.2);
      padding: 14px 16px; flex-shrink: 0;
    }
    #next-junction h3 { font-size: 10px; color: rgba(255,160,80,0.55); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    #next-name   { font-size: 15px; font-weight: 700; color: #fff; }
    #next-advice { font-size: 13px; margin-top: 5px; }
    #next-distance { font-size: 12px; color: #ffcc88; margin-top: 3px; }
    #next-detail { font-size: 10px; color: rgba(255,160,80,0.45); margin-top: 3px; }

    #speed-display {
      text-align: center; padding: 12px 8px;
      border-bottom: 1px solid rgba(255,100,30,0.12);
      flex-shrink: 0;
    }
    #speed-number { font-size: 46px; font-weight: 800; color: #ff6600; line-height: 1; letter-spacing: -1px; }
    #speed-label  { font-size: 10px; color: rgba(255,160,80,0.45); margin-top: 3px; letter-spacing: 1px; }

    #junction-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    #junction-list::-webkit-scrollbar { width: 4px; }
    #junction-list::-webkit-scrollbar-thumb { background: rgba(255,100,30,0.25); border-radius: 4px; }

    .junction-card {
      margin: 5px 10px; border-radius: 10px;
      background: rgba(35,8,0,0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,100,30,0.08);
      overflow: hidden; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .junction-card:hover { background: rgba(75,18,0,0.65); transform: translateX(3px); }
    .junction-card.is-next { border-color: rgba(255,200,50,0.45); box-shadow: 0 0 12px rgba(255,150,0,0.18); }
    .top-strip { height: 3px; }
    .junction-card.green  .top-strip { background: linear-gradient(90deg,#00e676,#69f0ae); }
    .junction-card.red    .top-strip { background: linear-gradient(90deg,#ff1744,#ff6d00); }
    .junction-card.yellow .top-strip { background: linear-gradient(90deg,#ffab00,#ffe57f); }
    .card-body { padding: 8px 12px 10px; }
    .card-top  { display: flex; justify-content: space-between; align-items: center; }
    .card-code { font-size: 10px; color: #ff9944; font-weight: 700; letter-spacing: 0.5px; }
    .card-name { font-size: 12px; font-weight: 600; color: #fff; margin-top: 2px; }
    .card-advice { font-size: 11px; margin-top: 4px; }
    .card-meta { font-size: 10px; color: rgba(255,160,80,0.38); margin-top: 3px; }
    .phase-bar-wrap { margin-top: 6px; background: rgba(255,100,30,0.1); border-radius: 3px; height: 3px; overflow: hidden; }
    .phase-bar { height: 100%; border-radius: 3px; }
    .junction-card.green  .phase-bar { background: linear-gradient(90deg,#00e676,#69f0ae); }
    .junction-card.red    .phase-bar { background: linear-gradient(90deg,#ff1744,#ff6d00); }
    .junction-card.yellow .phase-bar { background: linear-gradient(90deg,#ffab00,#ffe57f); }

    /* ── Map ── */
    #map { flex: 1; filter: sepia(0.5) saturate(0.8) brightness(0.7) hue-rotate(340deg); }

    /* ── Legend ── */
    #legend {
      position: absolute; bottom: 20px; right: 20px; z-index: 1000;
      background: rgba(18,4,0,0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,100,30,0.2);
      padding: 10px 14px; border-radius: 10px;
      font-size: 11px; line-height: 2.2; color: #ffccaa;
    }
    #legend div { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
  <h1>⚡ SignalX</h1>
  <div id="gps-status" class="searching">📡 Getting GPS...</div>
  <div id="clock"></div>
</div>

<!-- Search bar -->
<div id="search-bar">
  <div class="search-wrap">
    <input type="text" id="source-input" placeholder="📍 Your location (or use GPS)"
      oninput="showSuggestions(this.value,'source-suggestions','source')"
      onblur="setTimeout(()=>hideSuggestions('source-suggestions'),200)"
      autocomplete="off">
    <div class="suggestions-box" id="source-suggestions" style="display:none"></div>
  </div>
  <button id="use-gps-btn" onclick="startGPS()">📡 Use GPS</button>
  <div class="search-wrap">
    <input type="text" id="dest-input" placeholder="🏁 Destination"
      oninput="showSuggestions(this.value,'dest-suggestions','dest')"
      onblur="setTimeout(()=>hideSuggestions('dest-suggestions'),200)"
      autocomplete="off">
    <div class="suggestions-box" id="dest-suggestions" style="display:none"></div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="sidebar">
    <div id="next-junction">
      <h3>⚡ Next Junction</h3>
      <div id="next-name">Waiting for GPS...</div>
      <div id="next-advice"></div>
      <div id="next-distance"></div>
      <div id="next-detail"></div>
    </div>
    <div id="speed-display">
      <div id="speed-number">--</div>
      <div id="speed-label">RECOMMENDED SPEED (km/h)</div>
    </div>
    <div id="junction-list"></div>
  </div>
  <div id="map"></div>
</div>

<!-- Legend -->
<div id="legend">
  <div><span class="dot" style="background:#00e676"></span> Catch green</div>
  <div><span class="dot" style="background:#ff1744"></span> Stop / too fast</div>
  <div><span class="dot" style="background:#ffab00"></span> Marginal</div>
  <div><span class="dot" style="background:#fff"></span> Your location</div>
</div>

<script>
// ── Map ────────────────────────────────────────────────────────────
const map = L.map('map').setView([28.65, 77.15], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', { opacity: 0.4, maxZoom: 19 }).addTo(map);

const markers  = {};
let junctionData = [];
let userLat = null, userLng = null;
let destLat = null, destLng = null;
let userMarker = null, destMarker = null;
let watchId = null;

// ── Signal Engine ──────────────────────────────────────────────────
function getActivePlan(junction) {
  const now    = new Date();
  const curMin = now.getHours() * 60 + now.getMinutes();
  for (const plan of (junction.plans || [])) {
    const [sh, sm] = plan.slot_start.replace(/\s/g,'').split(':').map(Number);
    const [eh, em] = plan.slot_end.replace(/\s/g,'').split(':').map(Number);
    const s = sh*60+sm, e = eh*60+em;
    if (s <= e) { if (curMin >= s && curMin < e) return plan; }
    else        { if (curMin >= s || curMin < e) return plan; }
  }
  return null;
}

function getCyclePos(cycleSec) { return Math.floor(Date.now()/1000) % cycleSec; }

function getPhaseInfo(phases, pos) {
  let elapsed = 0;
  for (let i = 0; i < phases.length; i++) {
    if (elapsed + phases[i] > pos) return {
      phaseNum: i+1, total: phases.length,
      remaining: (elapsed+phases[i])-pos,
      duration: phases[i],
      pctDone: ((pos-elapsed)/phases[i])*100
    };
    elapsed += phases[i];
  }
  return null;
}

function recommendSpeed(distM, remaining) {
  if (remaining < 5)            return { text:'🔴 Stop — light changing',         color:'red',    kmph:0 };
  const kmph = (distM/remaining)*3.6;
  if (kmph > 70)                return { text:'🔴 Too fast — wait for next green', color:'red',    kmph };
  if (kmph < 10)                return { text:'🔴 Too slow — prepare to stop',     color:'red',    kmph };
  if (kmph >= 20 && kmph <= 60) return { text:`🟢 Drive at ${Math.round(kmph)} km/h`, color:'green',  kmph };
  return                               { text:`🟡 Drive at ${Math.round(kmph)} km/h`, color:'yellow', kmph };
}

// ── Haversine distance ─────────────────────────────────────────────
function dist(lat1,lng1,lat2,lng2) {
  const R=6371000, dL=(lat2-lat1)*Math.PI/180, dN=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dN/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ── GPS ────────────────────────────────────────────────────────────
function startGPS() {
  const el = document.getElementById('gps-status');
  el.className='searching'; el.textContent='📡 Getting GPS...';
  if (!navigator.geolocation) { el.className='error'; el.textContent='❌ GPS not supported'; return; }
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    el.className='active';
    el.textContent=`✅ GPS Active (±${Math.round(pos.coords.accuracy)}m)`;
    document.getElementById('source-input').value = `${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;
    if (userMarker) userMarker.setLatLng([userLat,userLng]);
    else {
      userMarker = L.circleMarker([userLat,userLng],{
        radius:10, color:'#fff', fillColor:'#fff', fillOpacity:0.9, weight:3
      }).addTo(map).bindPopup('📍 Your Location');
      map.setView([userLat,userLng],14);
    }
    refresh();
  }, err => {
    el.className='error'; el.textContent='❌ GPS denied';
    console.error(err);
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:5000 });
}

// ── Suggestions ────────────────────────────────────────────────────
function showSuggestions(query, boxId, type) {
  const box = document.getElementById(boxId);
  if (!query || query.length < 2) { box.style.display='none'; return; }
  const q = query.toLowerCase();
  const matches = junctionData.filter(j =>
    (j.junction_name||'').toLowerCase().includes(q) ||
    (j.junction_code||'').toLowerCase().includes(q) ||
    (j.district||'').toLowerCase().includes(q) ||
    (j.circle||'').toLowerCase().includes(q)
  ).slice(0,8);
  if (!matches.length) { box.style.display='none'; return; }
  box.innerHTML = matches.map(j => `
    <div class="suggestion-item" onmousedown="selectSuggestion('${j.junction_code}','${boxId}','${type}')">
      <span class="s-code">${j.junction_code}</span>${j.junction_name||''}
      <div class="s-sub">${j.district||''} ${j.circle?'· '+j.circle:''}</div>
    </div>`).join('');
  box.style.display='block';
}

function hideSuggestions(boxId) {
  document.getElementById(boxId).style.display='none';
}

function selectSuggestion(code, boxId, type) {
  const j = junctionData.find(j => j.junction_code===code);
  if (!j) return;
  const inputId = type==='source' ? 'source-input' : 'dest-input';
  document.getElementById(inputId).value = `${j.junction_code} — ${j.junction_name}`;
  hideSuggestions(boxId);

  if (j.lat && j.lng) {
    map.setView([j.lat,j.lng],15);
    if (markers[j.junction_code]) markers[j.junction_code].openPopup();
  }

  if (type==='source') {
    userLat=j.lat; userLng=j.lng;
    if (userMarker) userMarker.setLatLng([userLat,userLng]);
    else userMarker = L.circleMarker([userLat,userLng],{
      radius:10,color:'#fff',fillColor:'#fff',fillOpacity:0.9,weight:3
    }).addTo(map).bindPopup('📍 Your Location');
    refresh();
  } else {
    destLat=j.lat; destLng=j.lng;
    if (destMarker) destMarker.setLatLng([destLat,destLng]);
    else destMarker = L.circleMarker([destLat,destLng],{
      radius:10,color:'#ff6600',fillColor:'#ff6600',fillOpacity:0.9,weight:3
    }).addTo(map).bindPopup('🏁 Destination');
    refresh();
  }
}

// ── Get nearby junctions sorted by distance ────────────────────────
function getSortedJunctions() {
  const all = junctionData.filter(j => j.lat && j.lng);
  if (userLat===null) return all.slice(0,50);
  return all
    .map(j => ({...j, _dist: dist(userLat,userLng,j.lat,j.lng)}))
    .filter(j => j._dist < 2000)
    .sort((a,b) => a._dist - b._dist);
}

// ── Colors & icons ─────────────────────────────────────────────────
function colorHex(c) { return c==='green'?'#00e676':c==='red'?'#ff1744':'#ffab00'; }

function makeIcon(color, isNext) {
  const hex=colorHex(color), sz=isNext?18:13;
  return L.divIcon({
    className:'',
    html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${hex};border:2px solid #fff;box-shadow:0 0 ${isNext?12:5}px ${hex}88"></div>`,
    iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
  });
}

// ── Render ─────────────────────────────────────────────────────────
function refresh() {
  const list   = document.getElementById('junction-list');
  list.innerHTML = '';
  const sorted = getSortedJunctions();

  if (sorted.length===0 && userLat!==null) {
    document.getElementById('next-name').textContent     = '📍 No junctions within 2km';
    document.getElementById('next-advice').textContent   = 'Drive closer to a signal junction';
    document.getElementById('next-distance').textContent = '';
    document.getElementById('next-detail').textContent   = '';
    document.getElementById('speed-number').textContent  = '--';
    return;
  }

  const nextJ = sorted[0];

  // Next junction panel
  if (nextJ && userLat!==null) {
    const d    = Math.round(nextJ._dist || dist(userLat,userLng,nextJ.lat,nextJ.lng));
    const plan = getActivePlan(nextJ);
    if (plan) {
      const info   = getPhaseInfo(plan.phases, getCyclePos(plan.total_cycle_sec));
      const advice = info ? recommendSpeed(d, info.remaining) : {text:'⚠️ Unknown',color:'yellow',kmph:0};
      document.getElementById('next-name').textContent     = `${nextJ.junction_code} — ${nextJ.junction_name}`;
      document.getElementById('next-advice').textContent   = advice.text;
      document.getElementById('next-distance').textContent = `📏 ${d}m away`;
      document.getElementById('next-detail').textContent   = info ? `Phase ${info.phaseNum}/${info.total} · ${info.remaining}s left · Cycle ${plan.total_cycle_sec}s` : '';
      const spd = advice.kmph>0 ? Math.round(advice.kmph) : '--';
      document.getElementById('speed-number').textContent  = spd;
      document.getElementById('speed-number').style.color  = colorHex(advice.color);
    }
  }

  // Junction cards + markers
  sorted.forEach((j, idx) => {
    const isNext = idx===0 && userLat!==null;
    const d      = userLat!==null ? Math.round(j._dist||dist(userLat,userLng,j.lat,j.lng)) : null;
    const plan   = getActivePlan(j);
    if (!plan) return;
    const info   = getPhaseInfo(plan.phases, getCyclePos(plan.total_cycle_sec));
    if (!info) return;
    const advice = recommendSpeed(d||500, info.remaining);

    // Card
    const card = document.createElement('div');
    card.className = `junction-card ${advice.color}${isNext?' is-next':''}`;
    card.innerHTML = `
      <div class="top-strip"></div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-code">${isNext?'⚡ NEXT · ':''}${j.junction_code}</span>
          <span style="font-size:10px;color:rgba(255,160,80,0.4)">${d!==null?d+'m':''}</span>
        </div>
        <div class="card-name">${j.junction_name}</div>
        <div class="card-advice">${advice.text}</div>
        <div class="card-meta">Cycle ${plan.total_cycle_sec}s · Phase ${info.phaseNum}/${info.total} · ${info.remaining}s left</div>
        <div class="phase-bar-wrap"><div class="phase-bar" style="width:${info.pctDone||0}%"></div></div>
      </div>`;
    card.onclick = () => { if (j.lat&&j.lng) map.setView([j.lat,j.lng],16); };
    list.appendChild(card);

    // Marker
    if (j.lat && j.lng) {
      if (markers[j.junction_code]) {
        markers[j.junction_code].setIcon(makeIcon(advice.color,isNext));
        markers[j.junction_code].setPopupContent(
          `<b>${j.junction_code} — ${j.junction_name}</b><br>${advice.text}<br>Phase ${info.phaseNum}/${info.total} · ${info.remaining}s left`
        );
      } else {
        markers[j.junction_code] = L.marker([j.lat,j.lng],{icon:makeIcon(advice.color,isNext)})
          .addTo(map)
          .bindPopup(`<b>${j.junction_code} — ${j.junction_name}</b><br>${advice.text}`);
      }
    }
  });
}

// ── Clock ──────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    '🕐 ' + new Date().toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(updateClock,1000);
updateClock();

// Auto refresh every 10s
setInterval(refresh,10000);

// ── Load data ──────────────────────────────────────────────────────
fetch('junctions_geocoded.json')
  .then(r => r.json())
  .then(data => { junctionData=data; refresh(); startGPS(); })
  .catch(() => {
    document.getElementById('next-name').textContent='❌ Could not load junction data';
  });
</script>
</body>
</html>
